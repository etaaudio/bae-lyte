# BAE Lyte. Every push to main, and every PR, builds the Chrome, Firefox and
# Safari packages as downloadable artifacts. Pushing a tag like v1.1 also checks it matches
# the manifest and publishes them as a Release.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest   # Safari builds need Xcode
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lyte-packages
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "BAE Lyte $(jq -r .version manifest.json)" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
