<html lang="en">
<head>
<meta charset="utf-8">
<title>BAE Lyte</title>
<style>
  :root { color-scheme: light dark; --paper:#f4f5f7; --ink:#16181d; --soft:#596070; --groove:#d7dbe2; --live:#087a5a; --alarm:#c2372d; }
  @media (prefers-color-scheme: dark) { :root { --paper:#1b1d22; --ink:#eef0f4; --soft:#a0a7b4; --groove:#3a3f49; --live:#46cfa0; --alarm:#ff766a; } }
  body { margin:0; width:280px; padding:16px; background:var(--paper); color:var(--ink); font:13px/1.45 system-ui, -apple-system, sans-serif; }
  h1 { font-size:15px; margin:0 0 12px; }
  .mode { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--groove); border-radius:10px; overflow:hidden; }
  .mode button { font:inherit; padding:10px; border:0; background:none; color:var(--soft); cursor:pointer; }
  .mode button[aria-pressed="true"] { background:var(--live); color:#fff; font-weight:600; }
  label { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  select { font:inherit; }
  p { margin:10px 0 0; color:var(--soft); }
  p.bad { color:var(--alarm); }
  p.now { margin:0 0 12px; color:var(--ink); font-weight:600; white-space:pre-line; }
  select { max-width:150px; }
</style>
</head>
<body>
  <h1>BAE Lyte</h1>
  <p id="playing" class="now"></p>
  <div class="mode" role="group" aria-label="Mode">
    <button id="off" aria-pressed="true">Off</button>
    <button id="purist" aria-pressed="false">Purist</button>
  </div>
  <p id="modeNote"></p>
  <label>Audio codec
    <select id="audioCodec"><option value="auto">Auto</option></select>
  </label>
  <label>Video codec
    <select id="videoCodec"><option value="auto">Auto</option></select>
  </label>
  <p id="codecNote" class="bad" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
